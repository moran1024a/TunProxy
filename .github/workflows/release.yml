name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake debhelper dpkg-dev coreutils
          package_version=$(dpkg-parsechangelog -S Version)
          test "v${package_version}" = "$GITHUB_REF_NAME"
          dpkg-buildpackage -b -us -uc
          mkdir -p dist
          cp ../tunproxy_*_amd64.deb dist/
          sha256sum dist/tunproxy_*_amd64.deb > dist/tunproxy_amd64.deb.sha256
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/tunproxy_*_amd64.deb
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tunproxy_*_amd64.deb
            dist/tunproxy_amd64.deb.sha256
